name: Build and Release BatchIPServer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release EXE
        run: msbuild BatchIPServer.sln /p:Configuration=Release /p:Platform="Any CPU" /t:Rebuild /v:minimal

      - name: Verify EXE output
        shell: pwsh
        run: |
          $exe = "BatchIPServer\bin\Release\BatchIPServer.exe"
          if (-not (Test-Path $exe)) { throw "BatchIPServer.exe not found!" }
          Get-Item $exe | Select-Object Name, Length

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatchIPServer-exe
          path: BatchIPServer\bin\Release\BatchIPServer.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BatchIPServer\bin\Release\BatchIPServer.exe
          generate_release_notes: true
